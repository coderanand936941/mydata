<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner code — Nexora</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="auth-page">
<div class="auth-shell">
<a class="brand auth-brand" href="index.html"><span class="brand-mark">N</span><span>NEXORA</span></a>
<div class="auth-card code-card">
  <div class="code-symbol">✦</div>
  <div class="auth-heading"><span class="kicker">YOUR CONNECTION</span><h1>Enter your partner code.</h1><p>If a partner invited you to Nexora, enter their private code below. It connects your workspace to the right partner.</p></div>
  <form id="code-form">
    <label>Partner code<input id="partner-code" type="text" maxlength="40" required placeholder="e.g. RAHULX27" autocomplete="off"></label>
    <button class="btn btn-primary btn-block" type="submit">Verify code</button>
    <p class="form-message" id="code-message"></p>
  </form>
  <button class="link-button" id="skip-code">I don't have a partner code</button>
  <p class="small-note">You can request a code from your partner. A verified code can be associated with your account according to platform rules.</p>
</div></div>
<script type="module" src="assets/js/partner.js"></script>
</body></html>
